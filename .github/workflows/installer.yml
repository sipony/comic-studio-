name: Installer

# Costruisce gli installer per Windows, macOS e Linux (tutti da Linux) e li pubblica nella release.
# Parte con un tag v* (es. v0.7.0) oppure a mano da Actions → Installer → Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          pip install pillow uv
      - name: Interfaccia
        working-directory: frontend
        run: npm ci && npx ng build
      - name: Installer
        run: python installer/costruisci.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/dist/* --title "Comic Studio $GITHUB_REF_NAME" \
            --notes-file installer/NOTE_RILASCIO.md || gh release upload "$GITHUB_REF_NAME" installer/dist/* --clobber
